name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨2点执行
  workflow_dispatch:  # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # 设置 git 身份
          git config user.name "Li Yifan"
          git config user.email "liyifan_official@163.com"

          # 添加上游仓库（如果不存在则添加，如果已存在则设置 URL）
          if git remote get-url upstream &>/dev/null; then
            git remote set-url upstream https://github.com/ZhuLinsen/daily_stock_analysis.git
          else
            git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git
          fi

          # 获取所有远程 refs
          git fetch --all

          # 重置到当前远程 main
          git reset --hard origin/main

          # 检查 upstream 是否有新提交
          LOCAL=$(git rev-parse upstream/main)
          if [ "$(git rev-parse HEAD)" = "$LOCAL" ]; then
            echo "✅ 已是最新版本，无需同步"
            exit 0
          fi

          echo "📦 检测到上游有新提交，开始同步..."
          git merge upstream/main --no-edit -X ours

          # 使用 PAT 推送，绕过 GitHub App workflow 权限限制
          git push https://$GH_PAT@github.com/Lyf1122/daily_stock_analysis.git main

      - name: Notify via Feishu
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            MSG="✅ Fork 同步成功\n\n📌 已自动同步上游仓库 ZhuLinsen/daily_stock_analysis 的最新变更并合并到 main 分支"
          else
            MSG="❌ Fork 同步失败\n\n⚠️ 同步上游仓库时出现错误，请检查 GitHub Actions 日志"
          fi

          curl -s -X POST 'https://open.feishu.cn/open-apis/bot/v2/hook/e30c6f38-f7ee-4e60-a2e8-190c8e371b87' \
            -H 'Content-Type: application/json' \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"$MSG\"}}"
